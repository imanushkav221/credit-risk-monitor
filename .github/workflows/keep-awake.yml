# Free Streamlit Community Cloud apps go to sleep after a period without visits.
# This opens the app in a headless browser every 6 hours (and clicks the wake-up
# button if it is asleep) so reviewers never land on the sleep screen.
name: Keep Streamlit app awake

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install playwright==1.55.0 && python -m playwright install --with-deps chromium
      - run: python scripts/keep_awake.py
